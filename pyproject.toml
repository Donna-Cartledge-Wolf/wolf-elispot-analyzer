[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wolf-elispot"
version = "0.1.0"
description = "Automated 96-well ELISpot image analysis for plate detection, spot counting, QC, and data export."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "pandas>=2.0",
  "matplotlib>=3.7"
]

[project.scripts]
wolf-elispot = "wolf_elispot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wolf_elispot*"]
